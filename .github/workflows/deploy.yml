name: Deploy Manza Ganza

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Once daily; change to e.g. */6 * * * for a six-hour interval.
    - cron: '13 13 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: manza-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ vars.IG_USER_ID }}
      IG_API_MODE: ${{ vars.IG_API_MODE }}
      IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Optionally synchronize Instagram
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ -n "$IG_ACCESS_TOKEN" ]]; then
            python3 scripts/sync_instagram.py
          else
            echo "No Instagram token configured; keeping curated website content."
          fi
      - name: Commit refreshed public feed (when changed)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if ! git diff --quiet -- data/instagram.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/instagram.json
            git commit -m 'Update Instagram public feed'
            git push
          fi
      - name: Assemble static website
        shell: bash
        run: |
          mkdir -p _site
          cp index.html studio.html app.js studio.js styles.css favicon.svg CNAME robots.txt _site/
          cp -R assets data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
